<div class="carrito-card">
  <h3 class="textos">Resumen de tu orden</h3>

  @for (item of items; track item.id) {
    <div class="carrito-item">
      <span class="textos">{{ item.nombre }} x{{ item.cantidad }}</span>
      <span class="textos">$ {{ item.precio * item.cantidad }}</span>
      <button type="button" class="btn-quitar" (click)="eliminarItem.emit(item.id)">✕</button>
    </div>
  } @empty {
    <p class="textos">Tu carrito está vacío.</p>
  }

  <div class="total-row">
    <span class="textos">Total:</span>
    <span class="textos">$ {{ calcularTotal() }}</span>
  </div>

  <button type="button" class="boton_i" [disabled]="items.length === 0" (click)="confirmarCompra.emit()">
    Confirmar y pagar
  </button>
</div>
