<div class="login">
    <div class="logo_container">
        <img [src]="logo" alt="Logo" class="logo-img" />
    </div>

    <div class="volver-container">
        <button class="boton_i boton_secundario" type="button" (click)="volver()">Volver</button>
    </div>

    <div class="card">
        <h1 class="textos">Iniciar sesión como Administrador</h1>
        
        <form [formGroup]="form_login_admin" (ngSubmit)="iniciarSesion_admin()">
            <div>
                <app-campo-input id="email" label="Email" [control]="form_login_admin.controls.email" type="email">
                    <app-error-requerido mensaje="El Email es requerido" [errors]="form_login_admin.controls.email.errors"></app-error-requerido>
                    <app-error-email mensaje="Ingresa un Email válido." [errors]="form_login_admin.controls.email.errors"></app-error-email>
                </app-campo-input>
            </div>
            <div>
                <app-campo-input id="contrasena" label="Contraseña" [control]="form_login_admin.controls.contrasena" type="password">
                    <app-error-requerido mensaje="La Contraseña es requerida" [errors]="form_login_admin.controls.contrasena.errors"></app-error-requerido>
                    <app-error-minlenght mensaje="La Contraseña debe tener al menos 6 caracteres." [errors]="form_login_admin.controls.contrasena.errors"></app-error-minlenght>
                </app-campo-input>
            </div>
        </form>

        <button class="boton_i" type="submit" (click)="iniciarSesion_admin()">Iniciar sesión</button>
    </div>
</div>
