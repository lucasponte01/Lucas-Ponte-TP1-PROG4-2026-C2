<div class="login">
    <div class="logo_container">
        <img [src]="logo" alt="Logo" class="logo" />
    </div>
    <div class="card">
        <h1 class="textos">Iniciar sesión</h1>
        
        <form [formGroup]="form_login" (ngSubmit)="iniciarSesion()">
            <div>
                <app-campo-input id="email" label="Email" [control]="form_login.controls.email" type="email">
                    <app-error-requerido mensaje="El Email es requerido" [errors]="form_login.controls.email.errors"></app-error-requerido>
                    <app-error-email mensaje="Ingresa un correo electrónico válido." [errors]="form_login.controls.email.errors"></app-error-email>
                </app-campo-input>
            </div>
            <div>
                <app-campo-input id="contrasena" label="Contraseña" [control]="form_login.controls.contrasena" type="password">
                    <app-error-requerido mensaje="La Contraseña es requerida" [errors]="form_login.controls.contrasena.errors"></app-error-requerido>
                    <app-error-minlenght mensaje="La Contraseña debe tener al menos 6 caracteres." [errors]="form_login.controls.contrasena.errors"></app-error-minlenght>
                </app-campo-input>
            </div>
        </form>

       

        <button class="boton_i" type="submit" (click)="iniciarSesion()">Iniciar sesión</button>
        <button class="boton_i boton_secundario" routerLink="/anonimo">Entrar como invitado</button>
        <button class="boton_i boton_secundario" routerLink="/login/admin">Entrar como Administrador</button>
        
        <div class="contenedor-registro">
            <span class="texto-cuenta">¿No tienes cuenta? </span>
            <a class="registrate" routerLink="/registro">Registrarse</a>
        </div>
    </div>
</div>
