<body>
<header class="navbar">
  <a routerLink="/home"><img class="logo" [src]="logo_menus" alt="logo"></a>
  <button class="btn_logout" (click)="cerrar_sesion()">cerrar sesion</button>
</header>

<div class="sub-header">
  <button class="btn_nav">peliculas</button>
  <button class="btn_nav">candy</button>
  <button class="btn_nav">proximo</button>
  <button class="btn_nav">proximo</button>
  <button class="btn_nav">proximo</button>
</div>

<main class="container">
  
  <div class="filter-bar">
    <button class="btn_nav">Idioma ▾</button>
    <p class="texto">Buscador</p>
    <!-- Usando tu clase input personalizada -->
    
  </div>

  <div class="subtitle-row">
    <h2>Películas más vendidas</h2>
  </div>

  @if (loading() == false) {
    <p>Cargando películas...</p>
  } @else {
    
    <div class="movies-grid">
  @for (pelicula of peliculas(); track pelicula.id) {
    <div class="movie-card">
      <!-- Aquí llamas únicamente a la URL de esa película específica -->
      <img [src]="pelicula.imagen_url" [alt]="pelicula.nombre" />
      
      <span class="duration">{{ pelicula.duracion_min }} min</span>
      
      @if (pelicula.restriccion_edad) {
        <span class="badge-icon">+{{ pelicula.restriccion_edad }}</span>
      }
    </div>
    }
  </div>
  }
  <div class="subtitle-row" style="margin-top: 40px;">
    <h2>Catálogo de películas</h2>
  </div>
</main>
</body>
